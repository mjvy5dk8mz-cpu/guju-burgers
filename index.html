<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guju Burgers - Smash Burgers</title>
<meta name="description" content="Guju Burgers: smash burgers. Elegí entre la Big Mac y la Premium.">
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5f5496; --brand-dark:#4b4279; --accent:#f5b83d; --ink:#1c1b29;
  --muted:#5a5870; --bg:#5f5496; --card:#fff; --line:#e6e4ef; --ok:#1f9d55; --bad:#d64545;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cabin',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
h1,h2,h3,.poppins{font-family:'Poppins',sans-serif}
button{font:inherit;cursor:pointer;border:0}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;height:57px;box-shadow:0 1px 0 var(--line)}
.logo{display:flex;align-items:center;gap:14px;font-weight:600;font-family:'Poppins'}
.logo-img{width:42px;height:42px;object-fit:contain}
.hero-logo{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:50%;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);margin-bottom:6px}
.logo-mark{width:38px;height:38px;background:var(--brand);border-radius:4px;display:grid;place-items:center;color:var(--accent);font-family:'Poppins';font-weight:700;font-size:15px;letter-spacing:-1px}
nav{display:flex;align-items:center;gap:20px;font-weight:500}
nav a{color:var(--muted);text-decoration:none}
nav a.active{color:var(--ink);font-weight:600}
.cart-btn{position:relative;background:none;color:var(--brand);padding:4px}
.cart-btn svg{width:26px;height:26px}
.badge{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.btn{background:var(--brand);color:#fff;padding:10px 20px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--brand-dark)}

/* hero */
.hero{min-height:340px;padding:24px 0;position:relative;overflow:hidden;background:
  radial-gradient(circle at 20% 30%,#ffd45a 0 60px,transparent 62px),
  linear-gradient(180deg,#8a3b1d,#3a160b);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 70% 110%,#f5b83d 0 28%,transparent 29%),
  radial-gradient(ellipse at 30% 120%,#c0502a 0 30%,transparent 31%),
  radial-gradient(ellipse at 100% 60%,#6b2a12 0 25%,transparent 26%);opacity:.9}
.hero div{position:relative}
.hero h1{font-size:clamp(28px,6vw,52px);letter-spacing:1px;text-shadow:0 3px 12px rgba(0,0,0,.5)}
.hero p{font-size:clamp(14px,2.5vw,18px);text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* category bar */
.cats{position:sticky;top:57px;z-index:20;background:#f4f4f8;display:flex;align-items:center;gap:8px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cats .scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.cats .scroller::-webkit-scrollbar{display:none}
.cats a{white-space:nowrap;padding:10px 20px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.cats a.active{background:#e9e8f2;color:var(--ink)}
.arrow{background:#fff;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none;font-size:16px}

main{max-width:1100px;margin:0 auto;padding:24px 18px 40px}
section{scroll-margin-top:120px}

/* category scroller + scrollspy */
$('#prev').onclick = ()=>$('#scroller').scrollBy({left:-150});
$('#next').onclick = ()=>$('#scroller').scrollBy({left:150});
const links = [...document.querySelectorAll('.cats a')];
const io = new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting) links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+en.target.id));
}),{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));

render();

/* ocultar splash (mínimo 1.6 s para que se vea la animación) */
const t0 = performance.now();
const hideSplash = ()=>setTimeout(()=>$('#splash').classList.add('hide'), Math.max(0,1600-(performance.now()-t0)));
if(document.readyState==='complete') hideSplash(); else window.addEventListener('load',hideSplash);
setTimeout(()=>$('#splash').classList.add('hide'),4000);
</script>
</body>
</html>
