<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guju Burgers - Smash Burgers</title>
<meta name="description" content="Guju Burgers: smash burgers. Elegí entre la Big Mac, la Oklahoma y la Patty Melt.">
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5f5496; --brand-dark:#4b4279; --accent:#f5b83d; --ink:#1c1b29;
  --muted:#5a5870; --bg:#5f5496; --card:#fff; --line:#e6e4ef; --ok:#1f9d55; --bad:#d64545;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cabin',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
h1,h2,h3,.poppins{font-family:'Poppins',sans-serif}
button{font:inherit;cursor:pointer;border:0}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;height:57px;box-shadow:0 1px 0 var(--line)}
.logo{display:flex;align-items:center;gap:14px;font-weight:600;font-family:'Poppins'}
.logo-img{width:42px;height:42px;object-fit:contain}
.hero-logo{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:50%;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);margin-bottom:6px}
.logo-mark{width:38px;height:38px;background:var(--brand);border-radius:4px;display:grid;place-items:center;color:var(--accent);font-family:'Poppins';font-weight:700;font-size:15px;letter-spacing:-1px}
nav{display:flex;align-items:center;gap:20px;font-weight:500}
nav a{color:var(--muted);text-decoration:none}
nav a.active{color:var(--ink);font-weight:600}
.cart-btn{position:relative;background:none;color:var(--brand);padding:4px}
.cart-btn svg{width:26px;height:26px}
.badge{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.btn{background:var(--brand);color:#fff;padding:10px 20px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--brand-dark)}

/* hero */
.hero{min-height:340px;padding:24px 0;position:relative;overflow:hidden;background:
  radial-gradient(circle at 20% 30%,#ffd45a 0 60px,transparent 62px),
  linear-gradient(180deg,#8a3b1d,#3a160b);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 70% 110%,#f5b83d 0 28%,transparent 29%),
  radial-gradient(ellipse at 30% 120%,#c0502a 0 30%,transparent 31%),
  radial-gradient(ellipse at 100% 60%,#6b2a12 0 25%,transparent 26%);opacity:.9}
.hero div{position:relative}
.hero h1{font-size:clamp(28px,6vw,52px);letter-spacing:1px;text-shadow:0 3px 12px rgba(0,0,0,.5)}
.hero p{font-size:clamp(14px,2.5vw,18px);text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* category bar */
.cats{position:sticky;top:57px;z-index:20;background:#f4f4f8;display:flex;align-items:center;gap:8px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cats .scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.cats .scroller::-webkit-scrollbar{display:none}
.cats a{white-space:nowrap;padding:10px 20px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.cats a.active{background:#e9e8f2;color:var(--ink)}
.arrow{background:#fff;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none;font-size:16px}

main{max-width:1100px;margin:0 auto;padding:24px 18px 40px}
section{scroll-margin-top:120px}

/* hours */
.hours{background:#fff;border-radius:12px;padding:22px 18px;margin-bottom:28px}
.hours-head{display:flex;gap:14px;align-items:flex-start}
.hours-head svg{width:22px;height:22px;margin-top:6px}
.hours h2{font-size:20px}
.hours small{color:var(--muted);font-size:13px}
.state{margin-left:auto;font-size:12px;border:1px solid;border-radius:20px;padding:2px 10px;height:fit-content}
.state.open{color:var(--ok);background:#e8f7ee}
.state.closed{color:var(--bad);background:#fdecec}
.days{margin-top:16px;display:grid;gap:8px}
.day{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.day.today b::after{content:"Hoy";margin-left:10px;font-size:12px;background:#e9e8f2;padding:2px 8px;border-radius:6px;font-weight:500}
.day span{font-family:'Courier New',monospace;font-weight:700}
.more{display:block;margin:14px auto 0;background:none;color:var(--ink);font-size:14px}
#alldays{display:none}
#alldays.show{display:grid}

/* products */
.sec-title{color:#fff;font-size:22px;margin:8px 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,360px));justify-content:center;gap:20px;margin-bottom:32px}
.card{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pic{position:relative;border-radius:10px;aspect-ratio:1/1;background:linear-gradient(135deg,#8d8f98,#cfd0d6 50%,#8d8f98);display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.add{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;font-size:18px;font-weight:700}
.add:hover{background:var(--brand-dark)}
.card h3{font-size:17px}
.card p{text-transform:uppercase;font-size:13px;color:var(--muted);letter-spacing:.2px;flex:1}
.card p.about{text-transform:none;font-size:14px;color:var(--ink);flex:none;letter-spacing:0}
.toast{width:150px;height:22px;background:linear-gradient(#e0a24f,#b9742a);border-radius:10px;margin-top:-2px}
.onion-c{width:146px;height:8px;background:#b8741d;border-radius:6px;margin-top:-2px}
.price{font-family:'Poppins';font-weight:600;font-size:17px}

/* css burger */
.burger{width:170px;transform:scale(1.35);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.bun-t{width:150px;height:60px;background:radial-gradient(circle at 35% 25%,#f0a343,#c96a1c);border-radius:80px 80px 12px 12px;position:relative}
.bun-t::after{content:"";position:absolute;top:14px;left:38px;width:6px;height:3px;background:#fde7b8;border-radius:50%;box-shadow:24px 6px 0 #fde7b8,50px -2px 0 #fde7b8,64px 12px 0 #fde7b8,14px 20px 0 #fde7b8}
.lettuce{width:164px;height:12px;background:#6fb83c;border-radius:10px;margin-top:-4px;clip-path:polygon(0 0,100% 0,100% 60%,92% 100%,80% 60%,68% 100%,56% 60%,44% 100%,32% 60%,20% 100%,8% 60%,0 100%)}
.tomato{width:148px;height:9px;background:#d9382a;border-radius:6px;margin-top:-2px}
.onion{width:140px;height:5px;background:#f1e4ef;border-radius:6px;margin-top:-1px}
.cheese{width:162px;height:11px;background:#f8b81c;margin-top:-2px;clip-path:polygon(0 0,100% 0,100% 45%,88% 45%,84% 100%,76% 45%,0 45%)}
.patty{width:152px;height:16px;background:linear-gradient(#5b3322,#3a1f14);border-radius:10px;margin-top:-3px}
.patty.second{margin-top:-5px}
.bun-b{width:148px;height:20px;background:linear-gradient(#e0903a,#b85d17);border-radius:6px 6px 24px 24px;margin-top:-3px}

/* cart drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.overlay.show{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
aside.show{transform:none}
aside header{position:static;box-shadow:none;border-bottom:1px solid var(--line);padding:16px 20px;height:auto}
.close{background:none;font-size:24px;color:var(--muted)}
.items{flex:1;overflow:auto;padding:16px 20px;display:grid;gap:14px;align-content:start}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:6px;background:#e9e8f2;font-weight:700}
.foot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.total{display:flex;justify-content:space-between;font-family:'Poppins';font-weight:600;font-size:18px}
.foot .btn{width:100%;padding:13px}
.foot .btn:disabled{opacity:.5;cursor:not-allowed}

/* splash de carga */
#splash{position:fixed;inset:0;z-index:100;background:#f2f3f5;display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.buda{position:relative;width:200px;height:200px}
.buda img{width:100%;height:100%;object-fit:contain;transform-origin:50% 90%;animation:chew 1.1s ease-in-out infinite}
.crumb{position:absolute;left:50%;top:42%;width:8px;height:8px;border-radius:50%;background:#f5b83d;opacity:0;animation:crumb 1.1s ease-in infinite}
.crumb:nth-child(2){animation-delay:.15s;background:#d9382a;width:6px;height:6px;--dx:-34px}
.crumb:nth-child(3){animation-delay:.3s;--dx:30px}
.crumb:nth-child(4){animation-delay:.45s;background:#6fb83c;width:6px;height:6px;--dx:-12px}
.shadow{width:120px;height:9px;border-radius:50%;background:#d3d4da;animation:sh 1.1s ease-in-out infinite}
.loading{font-family:'Poppins';font-size:14px;color:#6b6a7c;letter-spacing:1px}
@keyframes chew{
  0%{transform:translateY(0) rotate(0) scale(1,1)}
  20%{transform:translateY(-6px) rotate(-3deg) scale(1.02,1.03)}
  40%{transform:translateY(0) rotate(2deg) scale(1.05,.95)}
  60%{transform:translateY(-3px) rotate(-2deg) scale(.98,1.03)}
  80%{transform:translateY(0) rotate(2deg) scale(1.04,.96)}
  100%{transform:translateY(0) rotate(0) scale(1,1)}}
@keyframes crumb{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,14px),90px)}}
@keyframes sh{0%,100%{transform:scaleX(1)}40%{transform:scaleX(1.1)}60%{transform:scaleX(.92)}}

footer{background:#fff;text-align:center;padding:22px;font-size:14px;color:var(--muted)}

@media(max-width:640px){
  header{padding:8px 14px}
  nav .hide-m{display:none}
  .btn.login{padding:8px 12px;font-size:14px}
}
</style>
</head>
<body>

<div id="splash"><div class="splash-in"><div class="buda"><img src="logo.webp" alt=""><i class="crumb"></i><i class="crumb"></i><i class="crumb"></i><i class="crumb"></i></div><div class="shadow"></div><div class="loading">Preparando tu burger...</div></div></div>

<header>
  <div class="logo"><img class="logo-img" src="logo.webp" alt="Guju Burgers"><span>Guju Burgers</span></div>
  <nav>
    <button class="cart-btn" id="openCart" aria-label="Carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </nav>
</header>

<div class="hero" id="inicio">
  <div>
    <img class="hero-logo" src="logo.webp" alt="Logo Guju Burgers">
    <h1>GUJU BURGERS</h1>
    <p>Smash burgers · Big Mac, Oklahoma y Patty Melt</p>
  </div>
</div>

<div class="cats">
  <button class="arrow" id="prev" aria-label="Anterior">‹</button>
  <div class="scroller" id="scroller">
    <a href="#clasicas" class="active">Big Mac</a>
    <a href="#oklahoma">Oklahoma</a>
    <a href="#pattymelt">Patty Melt</a>
  </div>
  <button class="arrow" id="next" aria-label="Siguiente">›</button>
</div>

<main id="menu">
  <section id="clasicas">
    <h2 class="sec-title">Big Mac</h2>
    <div class="grid" data-list="clasica"></div>
  </section>

  <section id="oklahoma">
    <h2 class="sec-title">Oklahoma Burger</h2>
    <div class="grid" data-list="oklahoma"></div>
  </section>

  <section id="pattymelt">
    <h2 class="sec-title">Patty Melt</h2>
    <div class="grid" data-list="pattymelt"></div>
  </section>
</main>

<footer>© 2026 Guju Burgers. Todos los derechos reservados.</footer>

<div class="overlay" id="overlay"></div>
<aside id="drawer">
  <header><h2 class="poppins" style="font-size:18px">Tu pedido</h2><button class="close" id="closeCart">×</button></header>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">$ 0,00</span></div>
    <button class="btn" id="checkout" disabled>Hacer pedido</button>
  </div>
</aside>

<script>
/* ====== CONFIG: editá precios y textos acá ====== */
const PRODUCTS = [
  { id:'clasica', cat:'clasica', name:'Big Mac',
    desc:'Smash burger x2 + cheddar + lechuga + pepinillos + cebolla + salsa especial', price:400,
    about:'Nuestra versión de la doble clásica: dos carnes smash bien doradas, cheddar derretido, lechuga fresca, pepinillos crocantes y salsa especial, todo en pan suave.',
    layers:['bun-t','cheese','patty','cheese','patty second','bun-b'] },
  { id:'oklahoma', cat:'oklahoma', name:'Oklahoma Burger',
    desc:'Smash burger x2 + cebolla caramelizada + cheddar', price:400, img:'oklahoma.webp',
    about:'Hamburguesa típica de Oklahoma (EE. UU.): la cebolla fina se aplasta junto con la carne en la plancha y se cocina con ella, quedando dulce, caramelizada y llena de sabor.' },
  { id:'pattymelt', cat:'pattymelt', name:'Patty Melt',
    desc:'Smash burger x2 + cheddar + cebolla caramelizada + pan tostado', price:400, img:'pattymelt.webp', ratio:'16/9',
    about:'Mitad hamburguesa, mitad sándwich tostado: carne jugosa, queso cheddar bien derretido y cebolla caramelizada entre dos rebanadas de pan doradas en la plancha con manteca.',
     },
];
const WHATSAPP = ''; // ej: '59899123456' para enviar el pedido por WhatsApp
/* ========================================================= */

const $ = s => document.querySelector(s);
const fmt = n => '$ ' + n.toLocaleString('es-UY',{minimumFractionDigits:2});
const cart = {};

function card(p){
  return `<article class="card">
    <div class="pic"${p.ratio?` style="aspect-ratio:${p.ratio}"`:''}>${p.img?`<img src="${p.img}" alt="${p.name}">`:`<div class="burger">${p.layers.map(l=>`<div class="${l}"></div>`).join('')}</div>`}
      <button class="add" data-id="${p.id}" aria-label="Agregar ${p.name}">+</button></div>
    <h3>${p.name}</h3><p>${p.desc}</p><p class="about">${p.about||''}</p><div class="price">${fmt(p.price)}</div></article>`;
}
document.querySelectorAll('[data-list]').forEach(el=>{
  const k = el.dataset.list;
  el.innerHTML = PRODUCTS.filter(p=>k==='all'||p.cat===k).map(card).join('');
});
document.addEventListener('click',e=>{
  const b = e.target.closest('.add'); if(!b) return;
  cart[b.dataset.id] = (cart[b.dataset.id]||0)+1; render(); openCart();
});

function render(){
  const ids = Object.keys(cart);
  const count = ids.reduce((a,i)=>a+cart[i],0);
  const total = ids.reduce((a,i)=>a+cart[i]*PRODUCTS.find(p=>p.id===i).price,0);
  $('#badge').hidden = !count; $('#badge').textContent = count;
  $('#total').textContent = fmt(total);
  $('#checkout').disabled = !count;
  $('#items').innerHTML = count ? ids.map(i=>{
    const p = PRODUCTS.find(x=>x.id===i);
    return `<div class="item"><div><b>${p.name}</b><div class="qty">
      <button data-m="${i}">−</button><span>${cart[i]}</span><button data-p="${i}">+</button></div></div>
      <b>${fmt(p.price*cart[i])}</b></div>`;
  }).join('') : '<p class="empty">Tu carrito está vacío</p>';
}
$('#items').addEventListener('click',e=>{
  const m=e.target.dataset.m, p=e.target.dataset.p;
  if(m){ if(--cart[m]<=0) delete cart[m]; }
  if(p){ cart[p]++; }
  render();
});
$('#checkout').onclick = ()=>{
  const lines = Object.keys(cart).map(i=>{const p=PRODUCTS.find(x=>x.id===i);return `${cart[i]}x ${p.name} - ${fmt(p.price*cart[i])}`});
  const total = Object.keys(cart).reduce((a,i)=>a+cart[i]*PRODUCTS.find(p=>p.id===i).price,0);
  const msg = `Hola Guju Burgers! Quiero pedir:\n${lines.join('\n')}\nTotal: ${fmt(total)}`;
  if(WHATSAPP) window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
  else alert(msg + '\n\n(Configurá WHATSAPP en el código para enviar pedidos)');
};
function openCart(){ $('#drawer').classList.add('show'); $('#overlay').classList.add('show'); }
function closeCart(){ $('#drawer').classList.remove('show'); $('#overlay').classList.remove('show'); }
$('#openCart').onclick = openCart; $('#closeCart').onclick = closeCart; $('#overlay').onclick = closeCart;

/* category scroller + scrollspy */
$('#prev').onclick = ()=>$('#scroller').scrollBy({left:-150});
$('#next').onclick = ()=>$('#scroller').scrollBy({left:150});
const links = [...document.querySelectorAll('.cats a')];
const io = new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting) links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+en.target.id));
}),{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));

render();

/* ocultar splash (mínimo 1.6 s para que se vea la animación) */
const t0 = performance.now();
const hideSplash = ()=>setTimeout(()=>$('#splash').classList.add('hide'), Math.max(0,1600-(performance.now()-t0)));
if(document.readyState==='complete') hideSplash(); else window.addEventListener('load',hideSplash);
setTimeout(()=>$('#splash').classList.add('hide'),4000);
</script>
</body>
</html>
